<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Enrollment Form</title>
</head>

<body>

    <h1 align="center">College Enrollment Form</h1>
    <hr>

    <p>
        Welcome to the student enrollment page.
        Enter your information in the form below.
    </p>

    <form action="#" method="post">

        
        <fieldset>
            <legend>Student Details</legend>

            <label for="student">Student Name:</label>
            <input type="text" id="student" name="student" placeholder="Your full name" minlength="2" maxlength="40"
                required>

            <br><br>

            <label for="mail">Email Address:</label>
            <input type="email" id="mail" name="email" placeholder="Enter college email" required>

            <br><br>

            <label for="mobile">Contact Number:</label>
            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10 digit number" required>

            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <br><br>

            <label for="age">Student Age:</label>
            <input type="number" id="age" name="age" min="16" max="35" required>

            <br><br>

            <label for="pass">Create Password:</label>
            <input type="password" id="pass" name="password" minlength="8" placeholder="Create a password" required>

            <br><br>

            <p>Select Gender:</p>

            <input type="radio" id="boy" name="gender" value="Male" required>
            <label for="boy">Male</label>

            <input type="radio" id="girl" name="gender" value="Female">
            <label for="girl">Female</label>

            <input type="radio" id="others" name="gender" value="Other">
            <label for="others">Other</label>

        </fieldset>

        <br>

       
        <fieldset>
            <legend>Academic Information</legend>

            <label for="program">Choose Your Program:</label>

            <select id="program" name="program" required>
                <option value="">Choose a course</option>
                <option value="cse">B.Tech Computer Science</option>
                <option value="aiml">B.Tech AI and ML</option>
                <option value="bca">Bachelor of Computer Applications</option>
                <option value="bsc">B.Sc Computer Science</option>
            </select>

            <br><br>

            <label for="semester">Current Semester:</label>
            <select id="semester" name="semester">
                <option value="">Select Semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
            </select>

            <br><br>

            <p>Which topics are you interested in?</p>

            <input type="checkbox" id="cpp" name="interest" value="C++">
            <label for="cpp">C++ Programming</label>

            <br>

            <input type="checkbox" id="html" name="interest" value="HTML">
            <label for="html">Website Development</label>

            <br>

            <input type="checkbox" id="data" name="interest" value="DSA">
            <label for="data">Data Structures</label>

            <br>

            <input type="checkbox" id="machine" name="interest" value="Machine Learning">
            <label for="machine">Machine Learning</label>

        </fieldset>

        <br>

      
        <fieldset>
            <legend>Other Information</legend>

            <label for="city">Your City:</label>
            <input type="text" id="city" name="city" placeholder="Enter city name">

            <br><br>

            <label for="address">Residential Address:</label>
            <br>

            <textarea id="address" name="address" rows="4" cols="35" maxlength="250"
                placeholder="Write your complete address"></textarea>

            <br><br>

            <label for="reason">Why did you choose this course?</label>
            <br>

            <textarea id="reason" name="reason" rows="3" cols="35" placeholder="Write a short answer"></textarea>

        </fieldset>

        <br>

        
        <fieldset>
            <legend>Student Declaration</legend>

            <input type="checkbox" id="agree" name="agree" required>

            <label for="agree">
                I confirm that the information given is correct.
            </label>

            <br><br>

            <input type="checkbox" id="updates" name="updates">

            <label for="updates">
                I would like to receive course updates.
            </label>

        </fieldset>

        <br>

        <button type="submit">Register Now</button>
        <button type="reset">Reset Details</button>

    </form>

    <hr>

    <footer>
        <p align="center">
            Student Enrollment Portal | 2026
        </p>
    </footer>

</body>

</html>
